<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">Com es carrega un &lt;script&gt; mentre el navegador llegeix l'HTML</text>

  <!-- llegenda -->
  <rect x="150" y="45" width="18" height="12" fill="#74c0fc"/><text x="174" y="56" fill="#212529">Lectura (parsing) de l'HTML</text>
  <rect x="390" y="45" width="18" height="12" fill="#ffa94d"/><text x="414" y="56" fill="#212529">Descàrrega del .js</text>
  <rect x="580" y="45" width="18" height="12" fill="#ff6b6b"/><text x="604" y="56" fill="#212529">Execució del .js</text>

  <!-- fila 1: normal -->
  <text x="20" y="108" font-weight="bold" fill="#212529">&lt;script&gt;</text>
  <text x="20" y="126" font-size="12" fill="#868e96">bloqueja</text>
  <rect x="160" y="92" width="180" height="26" fill="#74c0fc"/>
  <rect x="340" y="92" width="160" height="26" fill="#ffa94d"/>
  <rect x="500" y="92" width="80" height="26" fill="#ff6b6b"/>
  <rect x="580" y="92" width="240" height="26" fill="#74c0fc"/>
  <text x="420" y="138" text-anchor="middle" font-size="12" fill="#c92a2a">⛔ la pàgina s'atura mentre descarrega i executa</text>

  <!-- fila 2: async -->
  <text x="20" y="188" font-weight="bold" fill="#212529">&lt;script async&gt;</text>
  <text x="20" y="206" font-size="12" fill="#868e96">quan arriba, s'executa</text>
  <rect x="160" y="172" width="340" height="26" fill="#74c0fc"/>
  <rect x="340" y="200" width="160" height="14" fill="#ffa94d"/>
  <rect x="500" y="172" width="80" height="26" fill="#ff6b6b"/>
  <rect x="580" y="172" width="240" height="26" fill="#74c0fc"/>
  <text x="600" y="228" font-size="12" fill="#e8590c">⚠ l'ordre entre scripts no està garantit</text>

  <!-- fila 3: defer -->
  <text x="20" y="268" font-weight="bold" fill="#212529">&lt;script defer&gt;</text>
  <text x="20" y="286" font-size="12" fill="#868e96">recomanat ✔</text>
  <rect x="160" y="252" width="580" height="26" fill="#74c0fc"/>
  <rect x="340" y="280" width="160" height="14" fill="#ffa94d"/>
  <rect x="740" y="252" width="80" height="26" fill="#ff6b6b"/>
  <text x="560" y="312" text-anchor="middle" font-size="12" fill="#2b8a3e">✔ s'executa en acabar l'HTML i respectant l'ordre (com type="module")</text>

  <!-- eix temps -->
  <line x1="160" y1="322" x2="830" y2="322" stroke="#adb5bd" stroke-width="1"/>
  <text x="836" y="326" font-size="12" fill="#868e96">t</text>
</svg>
