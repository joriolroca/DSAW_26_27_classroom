<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#212529">On s'executa el codi?</text>

  <!-- CLIENT -->
  <rect x="30" y="55" width="340" height="320" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#1971c2">💻 ENTORN CLIENT (Frontend)</text>
  <!-- navegador -->
  <rect x="60" y="100" width="280" height="150" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/>
  <rect x="60" y="100" width="280" height="24" rx="8" fill="#dee2e6"/>
  <circle cx="76" cy="112" r="5" fill="#ff6b6b"/><circle cx="92" cy="112" r="5" fill="#ffd43b"/><circle cx="108" cy="112" r="5" fill="#51cf66"/>
  <rect x="124" y="105" width="200" height="14" rx="7" fill="#ffffff"/>
  <text x="132" y="116" font-size="10" fill="#868e96">https://botiga.cat</text>
  <rect x="80" y="140" width="70" height="36" rx="6" fill="#e8590c"/><text x="115" y="163" text-anchor="middle" fill="#fff" font-weight="bold">HTML</text>
  <rect x="165" y="140" width="70" height="36" rx="6" fill="#1971c2"/><text x="200" y="163" text-anchor="middle" fill="#fff" font-weight="bold">CSS</text>
  <rect x="250" y="140" width="70" height="36" rx="6" fill="#fcc419"/><text x="285" y="163" text-anchor="middle" fill="#212529" font-weight="bold">JS</text>
  <text x="200" y="202" text-anchor="middle" font-size="13" fill="#495057">el navegador descarrega el codi</text>
  <text x="200" y="222" text-anchor="middle" font-size="13" fill="#495057">i l'executa a l'ordinador de l'usuari</text>
  <text x="50" y="280" fill="#212529">👁 Codi <tspan font-weight="bold">visible</tspan> (Ctrl+U, F12)</text>
  <text x="50" y="305" fill="#212529">✏️ L'usuari el pot <tspan font-weight="bold">modificar</tspan></text>
  <text x="50" y="330" fill="#212529">⚡ Resposta immediata, sense xarxa</text>
  <text x="50" y="355" fill="#c92a2a">⚠ NO és de confiança</text>

  <!-- FRONTERA -->
  <line x1="450" y1="60" x2="450" y2="375" stroke="#c92a2a" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="450" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#c92a2a">frontera de confiança</text>
  <!-- fletxes -->
  <line x1="380" y1="165" x2="512" y2="165" stroke="#495057" stroke-width="2"/>
  <polygon points="520,165 508,159 508,171" fill="#495057"/>
  <rect x="408" y="142" width="84" height="18" fill="#ffffff"/>
  <text x="450" y="155" text-anchor="middle" font-size="12" fill="#495057">petició HTTP</text>
  <line x1="522" y1="215" x2="388" y2="215" stroke="#495057" stroke-width="2"/>
  <polygon points="380,215 392,209 392,221" fill="#495057"/>
  <rect x="386" y="222" width="128" height="34" fill="#ffffff"/>
  <text x="450" y="235" text-anchor="middle" font-size="12" fill="#495057">resposta</text>
  <text x="450" y="250" text-anchor="middle" font-size="11" fill="#868e96">(HTML, CSS, JS, JSON)</text>

  <!-- SERVIDOR -->
  <rect x="530" y="55" width="340" height="320" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
  <text x="700" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#e8590c">🖥 ENTORN SERVIDOR (Backend)</text>
  <!-- rack -->
  <rect x="560" y="100" width="120" height="150" rx="8" fill="#495057"/>
  <rect x="572" y="112" width="96" height="26" rx="4" fill="#343a40"/><circle cx="656" cy="125" r="4" fill="#51cf66"/>
  <rect x="572" y="146" width="96" height="26" rx="4" fill="#343a40"/><circle cx="656" cy="159" r="4" fill="#51cf66"/>
  <rect x="572" y="180" width="96" height="26" rx="4" fill="#343a40"/><circle cx="656" cy="193" r="4" fill="#ffd43b"/>
  <rect x="572" y="214" width="96" height="26" rx="4" fill="#343a40"/><circle cx="656" cy="227" r="4" fill="#51cf66"/>
  <!-- llenguatges -->
  <rect x="700" y="102" width="70" height="26" rx="6" fill="#7048e8"/><text x="735" y="120" text-anchor="middle" fill="#fff" font-size="13">PHP</text>
  <rect x="780" y="102" width="70" height="26" rx="6" fill="#1c7ed6"/><text x="815" y="120" text-anchor="middle" fill="#fff" font-size="13">Python</text>
  <rect x="700" y="136" width="70" height="26" rx="6" fill="#d9480f"/><text x="735" y="154" text-anchor="middle" fill="#fff" font-size="13">Java</text>
  <rect x="780" y="136" width="70" height="26" rx="6" fill="#2f9e44"/><text x="815" y="154" text-anchor="middle" fill="#fff" font-size="13">Node.js</text>
  <rect x="700" y="170" width="70" height="26" rx="6" fill="#862e9c"/><text x="735" y="188" text-anchor="middle" fill="#fff" font-size="13">C#</text>
  <rect x="780" y="170" width="70" height="26" rx="6" fill="#c2255c"/><text x="815" y="188" text-anchor="middle" fill="#fff" font-size="13">Ruby</text>
  <!-- BD -->
  <ellipse cx="775" cy="215" rx="42" ry="8" fill="#40c057"/>
  <rect x="733" y="215" width="84" height="26" fill="#40c057"/>
  <ellipse cx="775" cy="241" rx="42" ry="8" fill="#2f9e44"/>
  <text x="775" y="234" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">BD</text>
  <text x="550" y="280" fill="#212529">🔒 Codi <tspan font-weight="bold">ocult</tspan>: l'usuari només veu el resultat</text>
  <text x="550" y="305" fill="#212529">🗄 Accés a bases de dades i fitxers</text>
  <text x="550" y="330" fill="#212529">🔑 Autenticació, pagaments, lògica de negoci</text>
  <text x="550" y="355" fill="#2b8a3e">✔ És qui té l'última paraula</text>
</svg>
